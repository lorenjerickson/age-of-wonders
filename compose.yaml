name: age-of-wonders

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-age_of_wonders}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-age_of_wonders}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    init: true
    command: ["node", "scripts/dev-container.mjs", "api"]
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/age_of_wonders?schema=public}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
      GM_DISPLAY_NAME: ${GM_DISPLAY_NAME:-Game Master}
      GM_BOOTSTRAP_TOKEN: ${GM_BOOTSTRAP_TOKEN:-development-gm-session-change-me}
      CONTACT_ENCRYPTION_KEY: ${CONTACT_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_CALLBACK_URL: ${AUTH0_CALLBACK_URL:-}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-168}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-capture}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-capture}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.5-flare}
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-age-of-wonders}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aow-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aow-minio-password}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingFsWatchFile
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/packages/common/node_modules
      - /workspace/packages/ui/node_modules
      - /workspace/packages/common/dist
      - /workspace/packages/ui/dist
      - /workspace/apps/api/.container-build
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-aow-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-aow-minio-password}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    init: true
    command: ["node", "scripts/dev-container.mjs", "web"]
    environment:
      API_INTERNAL_URL: http://api:3000/api
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:5173}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - web_root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/packages/common/node_modules
      - /workspace/packages/ui/node_modules
      - /workspace/packages/common/dist
      - /workspace/packages/ui/dist
    depends_on:
      - api

volumes:
  postgres_data:
  object_storage:
  root_node_modules:
  web_root_node_modules:
  api_node_modules:
  web_node_modules:
