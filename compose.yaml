name: age-of-wonders

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-age_of_wonders}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-age_of_wonders}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    command: >-
      sh -c "CI=1 pnpm --filter @aow/api install --frozen-lockfile &&
      pnpm --filter @aow/api dev:docker"
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/age_of_wonders?schema=public}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-age-of-wonders}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aow-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aow-minio-password}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${API_PORT:-3000}:3000"
      - "9229:9229"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-aow-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-aow-minio-password}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    command: >-
      sh -c "CI=1 pnpm --filter @aow/web install --frozen-lockfile &&
      pnpm --filter @aow/web dev --host 0.0.0.0"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  object_storage:
  root_node_modules:
  api_node_modules:
  web_node_modules:
