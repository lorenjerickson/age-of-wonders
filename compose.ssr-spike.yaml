services:
  api:
    environment:
      PUBLIC_WEB_URL: http://localhost:8080
      WEB_ORIGIN: http://localhost:8080

  ssr-spike:
    build:
      context: .
      dockerfile: apps/web-ssr-spike/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3000/api
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3001
      PUBLIC_WEB_ORIGIN: http://localhost:8080
    expose:
      - "3001"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3001/healthz",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  ssr-spike-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./apps/web-ssr-spike/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ssr-spike:
        condition: service_healthy
